<script>
(function(){
var P=JSON.parse(document.getElementById('payload').textContent);
function u8(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
document.getElementById('f').addEventListener('submit',async function(e){
  e.preventDefault();var err=document.getElementById('err');err.textContent='';
  var pw=document.getElementById('pw').value;
  try{
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(P.iv)},key,u8(P.ct));
    var html=new TextDecoder().decode(pt);
    document.open();document.write(html);document.close();
  }catch(x){err.textContent='That is not it.';}
});
})();
</script></body></html>
